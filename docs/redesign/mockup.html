<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<title>Taxio Pilot Redesign</title>
<script>
/* Runs before first paint: resolve the saved theme (System / Light / Dark) so there is no flash. */
(function () {
  var pref = 'system';
  try { pref = JSON.parse(localStorage.getItem('tpm.theme')) || 'system'; } catch (e) {}
  if (/[?&]theme=(light|dark)/.test(location.search)) pref = RegExp.$1;
  var dark = pref === 'dark' || (pref === 'system' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.classList.add('preload');
})();
</script>
<style>
/* Static click-through mockup of the proposed Taxio Pilot v4 dashboard ("Graphite"). Dummy data only.
   No external requests: system fonts approximate Geist / Geist Mono. */

/* ---------- Tokens: scale, shape, motion (theme-independent) ---------- */
:root {
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;

  --font: "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Geist", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --sb-open: 224px; --sb-rail: 56px; --mock-h: 36px;
}
/* ---------- Colour tokens: Graphite dark (default) ---------- */
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101114; --sidebar: #0B0C0E; --surface: #17191D; --surface-2: #1C1F24; --surface-3: #252830;
  --line: #22252B; --line-2: #30343C;
  --text-1: #F2F3F5; --text-2: #B9BDC7; --text-3: #8E939F; --text-4: #5F646E;
  --accent: #8EA2FF; --accent-hover: #A5B5FF; --on-accent: #0B0C0E; --accent-soft: #1E2440; --accent-text: #AEBBFF;
  --warn: #F2C063; --warn-soft: #33290F; --warn-text: #F2C063;
  --ok: #5FD3A3; --ok-soft: #10291F; --ok-text: #5FD3A3;
  --danger: #FF8F8A; --danger-soft: #3A1618; --danger-text: #FF9D98; --danger-line: #5C2A2C;
  --pop-shadow: 0 18px 48px rgba(0, 0, 0, .55);
  --scrim: rgba(4, 5, 7, .62);
}
/* ---------- Colour tokens: Graphite light ---------- */
html[data-theme="light"] {
  color-scheme: light;
  --bg: #F7F8FA; --sidebar: #EEEFF2; --surface: #FFFFFF; --surface-2: #F2F3F6; --surface-3: #E6E8ED;
  --line: #E4E6EB; --line-2: #D3D6DD;
  --text-1: #15171B; --text-2: #3D424C; --text-3: #626874; --text-4: #A0A5AF;
  --accent: #4A5FD9; --accent-hover: #3B4FC2; --on-accent: #FFFFFF; --accent-soft: #ECEFFD; --accent-text: #3346B8;
  --warn: #B07A10; --warn-soft: #FBF1D8; --warn-text: #7A5200;
  --ok: #138A5C; --ok-soft: #E1F4EB; --ok-text: #0B6B46;
  --danger: #C8323C; --danger-soft: #FCE9EA; --danger-text: #A82630; --danger-line: #F1C2C5;
  --pop-shadow: 0 18px 48px rgba(20, 22, 30, .16);
  --scrim: rgba(22, 24, 30, .30);
}
html.rm { --d1: 0ms; --d2: 0ms; --d3: 0ms; }

html.rm *, html.rm *::before, html.rm *::after { animation-duration: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0ms !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0ms !important; } }
html.preload *, html.preload *::before, html.preload *::after { transition: none !important; animation: none !important; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: var(--d3); animation-timing-function: var(--ease); }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text-2); font: var(--fs-md)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }

.mono { font-family: var(--mono); font-size: .94em; }

.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: var(--s2); }
.wrap { flex-wrap: wrap; }
.t3 { color: var(--text-3); }
.t1 { color: var(--text-1); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: var(--r2); border: 1px solid var(--line-2); background: transparent; color: var(--text-1); font-weight: 550; font-size: var(--fs-md); white-space: nowrap; transition: background var(--d1) var(--ease), border-color var(--d1), color var(--d1), transform var(--d1) var(--ease), opacity var(--d1); }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { color: var(--danger-text); border-color: var(--danger-line); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }

.ib { width: 30px; height: 30px; border-radius: 7px; border: 0; background: transparent; color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; flex: none; transition: background var(--d1), color var(--d1), transform var(--d1) var(--ease); }
.ib:hover:not(:disabled) { background: var(--surface-3); color: var(--text-1); }
.ib:active:not(:disabled) { transform: scale(.92); }
.ib:disabled { opacity: .35; }
.link { border: 0; background: none; padding: 0; color: var(--accent-text); font-weight: 550; font-size: inherit; }
.link:hover { text-decoration: underline; }
.note .link { white-space: nowrap; }

/* ---------- Tags (status pills) ---------- */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; flex: none; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.read { color: var(--text-3); background: var(--surface-2); }
.tag.write { color: var(--warn-text); background: var(--warn-soft); }
.tag.ok { color: var(--ok-text); background: var(--ok-soft); }
.tag.warn { color: var(--warn-text); background: var(--warn-soft); }
.tag.danger { color: var(--danger-text); background: var(--danger-soft); }
.tag.acc { color: var(--accent-text); background: var(--accent-soft); }
.tag.local { color: var(--text-2); background: var(--surface-3); }

/* ---------- Shell ---------- */
#app { position: relative; height: calc(100vh - var(--mock-h)); overflow: clip; }
.sb { position: absolute; left: 0; top: 0; bottom: 0; width: var(--sb-open); z-index: 30; }
#app.sb-collapsed .sb { width: var(--sb-rail); }
.sb-bg { position: absolute; top: 0; bottom: 0; left: 0; width: var(--sb-open); background: var(--sidebar); transform-origin: 0 0; transition: transform var(--d3) var(--ease); }
#app.sb-collapsed .sb-bg { transform: scaleX(.25); }
.sb-edge { position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: var(--line); transform: translateX(223px); transition: transform var(--d3) var(--ease); }
#app.sb-collapsed .sb-edge { transform: translateX(55px); }
#app.sb-overlay .sb-bg { box-shadow: var(--pop-shadow); }
.sb-in { position: relative; height: 100%; display: flex; flex-direction: column; padding: 12px 8px; }
.brand { display: flex; align-items: center; gap: 10px; height: 36px; padding-left: 6px; margin-bottom: 8px; white-space: nowrap; }
.logo { width: 28px; height: 28px; border-radius: 8px; border: 0; padding: 0; background: var(--text-1); color: var(--bg); display: flex; align-items: center; justify-content: center; flex: none; position: relative; transition: transform var(--d1) var(--ease); }
.logo:active { transform: scale(.94); }
.logo svg { position: absolute; transition: opacity var(--d1); }
.logo .lg-side { opacity: 0; }
#app.sb-collapsed .logo:hover .lg-side, #app.sb-collapsed .logo:focus-visible .lg-side { opacity: 1; }
#app.sb-collapsed .logo:hover .lg-mark, #app.sb-collapsed .logo:focus-visible .lg-mark { opacity: 0; }
.brand .ib { margin-right: 2px; }
#nav { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
#app.sb-collapsed #nav { overflow: visible; }
.brand b { display: block; color: var(--text-1); font: 650 14px/1.1 var(--font-display); letter-spacing: -.01em; }
.brand span { font: 11px var(--mono); color: var(--text-3); }
.fade-l { transition: opacity var(--d2) var(--ease) 70ms; }
#app.sb-collapsed .fade-l { opacity: 0; pointer-events: none; transition-delay: 0ms; }
.ng { position: relative; font-size: var(--fs-xs); color: var(--text-3); padding: 9px 0 3px 11px; white-space: nowrap; font-weight: 550; }
.ng::before { content: ""; position: absolute; left: 10px; width: 20px; top: 50%; height: 1px; background: var(--line-2); opacity: 0; transition: opacity var(--d2); }
#app.sb-collapsed .ng::before { opacity: 1; }
.ni { position: relative; display: flex; align-items: center; gap: 11px; height: 30px; padding: 0 0 0 11px; border-radius: var(--r2); border: 0; background: transparent; color: var(--text-2); width: 100%; text-align: left; white-space: nowrap; font-weight: 500; font-size: var(--fs-md); transition: background var(--d1), color var(--d1); }
.ni svg { color: var(--text-3); transition: color var(--d1); }
.ni:hover { background: var(--surface-2); color: var(--text-1); }
.ni[aria-current="page"] { background: var(--surface-3); color: var(--text-1); }
.ni[aria-current="page"] svg { color: var(--text-1); }
.ni .lbl { flex: 1; min-width: 0; }
.nb { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 700; margin-right: 6px; flex: none; transition: transform var(--d2) var(--ease); }
.nb.warn { background: var(--warn); color: #1A1404; }
.nb.n { background: var(--surface-3); color: var(--text-1); }
.nb + .nb { margin-left: -2px; }
#app.sb-collapsed .ni .nb.n { display: none; }
#app.sb-collapsed .ni .nb.warn { position: absolute; left: 22px; top: 2px; min-width: 15px; height: 15px; font-size: 10px; padding: 0 4px; margin: 0; }
#app.sb-collapsed .ni .dot-run { opacity: 1; }
.dot-run { position: absolute; left: 25px; bottom: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; transition: opacity var(--d2); }
#app.sb-collapsed .ni[data-tip]:hover::after, #app.sb-collapsed .ni[data-tip]:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
.ni[data-tip]::after { content: attr(data-tip); position: absolute; left: 50px; top: 50%; transform: translate(-4px, -50%); opacity: 0; pointer-events: none; background: var(--surface-3); color: var(--text-1); border: 1px solid var(--line-2); padding: 4px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; transition: opacity var(--d1), transform var(--d1) var(--ease); z-index: 50; }
.sb-foot { margin-top: auto; display: flex; flex-direction: column; gap: 1px; }
.user { display: flex; align-items: center; gap: 10px; padding: 8px 0 0 6px; margin-top: 6px; border-top: 1px solid var(--line); white-space: nowrap; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); color: var(--text-1); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.user b { display: block; color: var(--text-1); font-size: 12.5px; font-weight: 550; }
.user span { font-size: 11.5px; color: var(--text-3); }
.sb-scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--d3) var(--ease); z-index: 25; }
#app.sb-overlay .sb-scrim { opacity: 1; pointer-events: auto; }

.main { position: absolute; top: 0; bottom: 0; right: 0; left: var(--sb-open); display: flex; flex-direction: column; transition: transform var(--d3) var(--ease); }
#app.sb-collapsed .main, #app.sb-overlay .main { left: var(--sb-rail); }
.top { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.top h1 { font: 650 var(--fs-lg)/1.2 var(--font-display); color: var(--text-1); letter-spacing: -.01em; white-space: nowrap; }
.top .crumb { color: var(--text-3); font-size: var(--fs-sm); white-space: nowrap; }
.cmdk { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border-radius: var(--r2); border: 1px solid var(--line-2); background: var(--surface); color: var(--text-3); min-width: 240px; transition: border-color var(--d1), background var(--d1); }
.cmdk:hover { border-color: var(--text-4); color: var(--text-2); }
.cmdk span { flex: 1; text-align: left; }
.meter { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: var(--r2); border: 1px solid transparent; background: transparent; color: var(--text-2); font-size: var(--fs-sm); white-space: nowrap; transition: background var(--d1); }
.meter:hover { background: var(--surface-2); }
.meter .segs { display: flex; gap: 2px; }
.meter .segs i { width: 5px; height: 14px; border-radius: 2px; background: var(--surface-3); transition: background var(--d2); }
.meter .segs i.on { background: var(--accent); }
.meter .segs i.hold { background: var(--warn); }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-gutter: stable; }
.page { max-width: 920px; margin: 0 auto; padding: 28px 32px 32px; }
.view { animation: viewIn var(--d3) var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }
.lead { color: var(--text-3); max-width: 640px; margin: 2px 0 6px; }
.ph { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.ph h2 { font: 650 var(--fs-xl)/1.25 var(--font-display); color: var(--text-1); letter-spacing: -.015em; }

/* ---------- Segmented control ---------- */
.seg { display: inline-flex; padding: 2px; border-radius: var(--r2); background: var(--surface-2); gap: 2px; position: relative; }
.seg button { position: relative; z-index: 1; height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); font-weight: 550; font-size: var(--fs-sm); white-space: nowrap; transition: color var(--d1); }
.seg button[aria-pressed="true"] { color: var(--text-1); }
.seg .thumb { position: absolute; z-index: 0; top: 2px; left: 0; height: 28px; border-radius: 6px; background: var(--surface); box-shadow: 0 0 0 1px var(--line-2); transition: transform var(--d3) var(--ease), width var(--d3) var(--ease); }
html[data-theme="dark"] .seg .thumb { background: var(--surface-3); box-shadow: none; }

/* ---------- Forms ---------- */
.frow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 24px; padding: 18px 0; border-top: 1px solid var(--line); }
.frow:first-child { border-top: 0; padding-top: 4px; }
.fl { color: var(--text-1); font-weight: 550; }
.fl small { display: block; color: var(--text-3); font-weight: 400; font-size: var(--fs-sm); margin-top: 2px; }
.tg { height: 30px; padding: 0 12px; border-radius: var(--r2); border: 1px solid var(--line-2); background: transparent; color: var(--text-2); font-weight: 500; font-size: var(--fs-md); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: background var(--d1), color var(--d1), border-color var(--d1), transform var(--d1) var(--ease); }
.tg:hover:not(:disabled) { border-color: var(--text-4); color: var(--text-1); }
.tg:active:not(:disabled) { transform: scale(.96); }
.tg[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.tg:disabled { color: var(--text-4); border-style: dashed; }
.tgs { display: flex; flex-wrap: wrap; gap: 6px; }
.cap { font-size: var(--fs-xs); color: var(--text-3); margin: 0 0 6px; font-weight: 550; }
.cap + .tgs + .cap { margin-top: 12px; }
.months { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; max-width: 480px; }
.months .tg { justify-content: center; padding: 0; }
.input { height: 32px; padding: 0 10px; border-radius: var(--r2); border: 1px solid var(--line-2); background: var(--surface); color: var(--text-1); outline: none; transition: border-color var(--d1); min-width: 0; }
.input:focus { border-color: var(--accent); }
.yr { display: inline-flex; align-items: center; gap: 2px; margin-left: 8px; color: var(--text-1); font-weight: 600; }
.quick { display: flex; gap: 2px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
.note { font-size: var(--fs-sm); color: var(--text-3); margin-top: 8px; display: flex; gap: 6px; align-items: flex-start; }
.note svg { margin-top: 2px; }
.cchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cchip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 4px 0 10px; border-radius: var(--r2); background: var(--surface-2); color: var(--text-1); font-weight: 500; max-width: 100%; animation: popIn var(--d2) var(--ease) both; }
.cchip .code { font: 600 11px var(--mono); color: var(--text-3); }
.cchip .pic { font-size: 11.5px; color: var(--text-3); border: 0; background: none; padding: 0 2px; }
.cchip .pic.multi { color: var(--accent-text); text-decoration: underline dotted; }
.cchip.out { animation: popOut var(--d2) var(--ease) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.94); } }
@keyframes popOut { to { opacity: 0; transform: scale(.94); } }
.drop { border: 1px dashed var(--line-2); border-radius: var(--r3); padding: 18px; display: flex; align-items: center; gap: 12px; color: var(--text-3); }
.file { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r3); background: var(--surface-2); animation: popIn var(--d2) var(--ease) both; }
.file b { color: var(--text-1); font-weight: 550; }
.file .t3 { font-size: var(--fs-sm); }
.abar { position: sticky; bottom: 0; z-index: 5; margin-top: 12px; display: flex; align-items: center; gap: 16px; padding: 14px 0 16px; background: var(--bg); border-top: 1px solid var(--line); }
.abar .sum { flex: 1; min-width: 0; }

.abar .sum div { font-size: var(--fs-sm); color: var(--text-3); }

/* ---------- Collapsible (progressive disclosure) ---------- */
.coll { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--d3) var(--ease); }

.coll > div { overflow: hidden; min-height: 0; }

.coll.open > div > .ci { opacity: 1; transform: none; }
.disc { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; color: var(--text-2); font-weight: 550; }
.disc:hover { color: var(--text-1); }
.disc svg { transition: transform var(--d2) var(--ease); }
.disc[aria-expanded="true"] svg { transform: rotate(90deg); }

/* ---------- Runs ---------- */
.filters { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
.fchip { height: 28px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid transparent; background: transparent; color: var(--text-3); font-weight: 550; font-size: var(--fs-sm); display: inline-flex; gap: 6px; align-items: center; transition: background var(--d1), color var(--d1), transform var(--d1) var(--ease); }
.fchip b { font-weight: 650; color: var(--text-2); }
.fchip:hover { color: var(--text-1); background: var(--surface-2); }
.fchip:active { transform: scale(.96); }
.fchip[aria-pressed="true"] { background: var(--surface-3); color: var(--text-1); }
.fchip.warn b { color: var(--warn-text); }
.fchip.danger b { color: var(--danger-text); }
.sec { margin-top: 26px; }

function flip(container, html) {
  const old = new Map(), bars = new Map();
  $$('[data-k]', container).forEach((el) => old.set(el.dataset.k, el.getBoundingClientRect().top));
  $$('[data-bar]', container).forEach((el) => bars.set(el.dataset.bar, el.style.getPropertyValue('--p')));
  container.innerHTML = html;
  if (rm()) return;
  $$('[data-k]', container).forEach((el) => {
    const k = el.dataset.k;
    if (old.has(k)) {
      const dy = old.get(k) - el.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) { el.style.transition = 'none'; el.style.transform = 'translateY(' + dy + 'px)'; void el.offsetWidth; el.style.transition = ''; el.style.transform = ''; }
    } else if (old.size) el.classList.add('enter-row');

  $$('[data-bar]', container).forEach((el) => {

  });
}

  amend: (el) => { const b = FOUND[+el.dataset.i], c = cl(F.fix.for[0]); confirmChange({ tier: 2, title: 'Amend Bukti Potong ' + b[0] + '?', ok: 'Amend in Coretax', facts: [['Client', esc(c.n)], ['Bukti Potong', b[0] + ' · ' + b[2]]], extra: '<table class="tb"><thead><tr><th>Field</th><th class="num">Now</th><th class="num">After</th></tr></thead><tbody><tr><td>Penghasilan Bruto</td><td class="num">' + rp(b[3]) + '</td><td class="num"><input class="input mono" value="' + (b[3] + 1000000).toLocaleString('id-ID') + '" style="width:130px;text-align:right"></td></tr><tr><td>PPh</td><td class="num">' + rp(b[4]) + '</td><td class="num">' + rp(b[4] + 50000) + '</td></tr></tbody></table>', effect: 'Coretax creates a Pembetulan of this Bukti Potong. If it was already reported, its SPT Masa needs a Pembetulan too.', ack: 'I checked the new values.', onOk: () => { started(addRun({ client: c.c, feat: 'Fix Bukti Potong', params: 'Amend ' + b[0], kind: 'write', total: 1, items: [b[0].slice(-4)] }), 'Amend'); } }); },
  'cancel-bp': (el) => { const b = FOUND[+el.dataset.i], c = cl(F.fix.for[0]); confirmChange({ tier: 2, danger: true, typed: c.c, title: 'Cancel Bukti Potong ' + b[0] + '?', ok: 'Cancel Bukti Potong', backLabel: 'Keep it', facts: [['Client', esc(c.n) + ' <span class="t3 mono">' + c.npwp + '</span>'], ['Bukti Potong', b[0] + ' · ' + b[2] + ' · ' + rp(b[3])]], effect: 'Batalkan cannot be undone. If this slip was already reported, its SPT Masa needs a Pembetulan.', onOk: () => { started(addRun({ client: c.c, feat: 'Fix Bukti Potong', params: 'Cancel ' + b[0], kind: 'write', total: 1, items: [b[0].slice(-4)] }), 'Cancel'); } }); },
  tseg: (el) => { const k = el.dataset.k, v = +el.dataset.v; const map = { kmode: ['kredit', 'mode'], dmode: ['dividen', 'mode'], kspt: ['konsep', 'spt'], kact: ['konsep', 'act'], a1tab: ['a1', 'tab'] }; if (map[k]) { T[map[k][0]][map[k][1]] = v; rerender(); } else { $$('button', el.parentNode).forEach((b) => b.setAttribute('aria-pressed', String(b === el))); placeThumbs(el.parentNode.parentNode); } },
  tfile: (el) => { T[el.dataset.page].file = true; rerender(); },
  'kredit-go': () => { const c = cl(F.kredit.for[0]); confirmChange({ tier: 2, title: 'Credit 16 Faktur Masukan?', ok: 'Credit 16 Faktur', facts: [['Client', esc(c.n)], ['Faktur', '16 Faktur Masukan · 2 skipped (already credited)'], ['Masa Pengkreditan', T.kredit.mode ? '10/2026 for all' : 'From the Excel column']], effect: 'Credited Faktur Masukan count in the PPN SPT of that Masa Pajak.', ack: 'I checked the Masa Pengkreditan.', onOk: () => started(addRun({ client: c.c, pic: S.picSel[c.c] || c.p[0], feat: 'Credit Faktur Masukan', params: '16 Faktur Masukan · Masa 10/2026', kind: 'write', total: 16, items: Array.from({ length: 16 }, (_, i) => '#' + (i + 1)) }), 'Credit Faktur Masukan') }); },
  'billing-go': () => { const c = cl(F.billing.for[0]); const nom = ($('#nominal') || {}).value || T.billing.nominal; T.billing.nominal = nom; confirmChange({ tier: 1, title: 'Create Kode Billing?', ok: 'Create Kode Billing', facts: [['Client', esc(c.n)], ['Jenis Pajak', 'PPh 25 · Masa Pajak ' + masaText(F.billing)], ['Nominal', 'Rp' + esc(nom)]], effect: 'Creates a Kode Billing in Coretax and saves its PDF. Nothing is paid.', onOk: () => started(addRun({ client: c.c, feat: 'PPh 25 Kode Billing', params: 'Masa Pajak ' + masaText(F.billing) + ' · Rp' + nom, kind: 'write', total: 1, items: [mm(F.billing.masa[0]) + '26'] }), 'Kode Billing') }); },
  'dividen-go': () => { const c = cl(F.dividen.for[0]); const m = T.dividen.mode; const modes = ['Check the Excel', 'Import to Coretax', 'Create case']; if (!m) return started(addRun({ client: c.c, feat: 'e-Reporting', params: 'Check the Excel · 2026', total: 4, items: ['row 1', 'row 2', 'row 3', 'row 4'] }), 'e-Reporting check'); confirmChange({ tier: 1, title: modes[m] + '?', ok: modes[m], facts: [['Client', esc(c.n)], ['Report', 'Laporan Realisasi Investasi (Dividen) · 2026']], effect: m === 1 ? 'Imports 4 rows into the open e-Reporting case.' : 'Creates a new e-Reporting case (AS.39-01).', onOk: () => started(addRun({ client: c.c, feat: 'e-Reporting', params: modes[m] + ' · 2026', kind: 'write', total: 1, items: ['2026'] }), 'e-Reporting') }); },
  'konsep-go': () => { const c = cl(F.konsep.for[0]); const acts = ['Create Konsep SPT', 'Download Konsep SPT', 'Posting']; const a = T.konsep.act; const spt = ['PPh 21/26', 'PPh Unifikasi'][T.konsep.spt]; const spec = { client: c.c, feat: 'Konsep SPT', params: acts[a] + ' · ' + spt + ' · ' + masaText(F.konsep), kind: a === 1 ? 'read' : 'write', total: 1, items: [mm(F.konsep.masa[0]) + '26'] }; if (a === 1) return started(addRun(spec), 'Konsep SPT'); confirmChange({ tier: 1, title: acts[a] + '?', ok: acts[a], facts: [['Client', esc(c.n)], ['SPT', spt + ' · Masa Pajak ' + masaText(F.konsep)]], effect: a === 0 ? 'Creates the Konsep SPT in Coretax. It is not submitted.' : 'Runs Posting in Coretax so the Konsep SPT picks up the latest Bukti Potong. It is not submitted.', onOk: () => started(addRun(spec), 'Konsep SPT') }); },
  'a1-go': () => { const c = cl(F.a1.for[0]); started(addRun({ client: c.c, feat: 'Annual PPh 21 Recap', params: 'Full-year download · 2026', total: 12, items: monthItems(1, 12) }), 'Annual PPh 21 Recap'); },
  'a1-nik': () => { const c = cl(F.a1.for[0]); confirmChange({ tier: 2, title: 'Correct NIK on 7 Bukti Potong?', ok: 'Correct 7 Bukti Potong', facts: [['Client', esc(c.n)], ['From the recap', '5 NIK (sheet NIK) · 2 Bukti Potong (sheet Pembetulan)'], ['Check', 'Official Coretax name for NIK Baru must match Nama Baru']], effect: 'Creates Pembetulan of 7 BPMP in Coretax. Rows that do not match are left untouched and listed in the Excel.', ack: 'I checked NIK Baru and Nama Baru against the KTP.', onOk: () => started(addRun({ client: c.c, feat: 'Annual PPh 21 Recap', params: 'BPMP NIK Pembetulan · 7 Bukti Potong', kind: 'write', total: 7, items: Array.from({ length: 7 }, (_, i) => '#' + (i + 1)) }), 'NIK Pembetulan') }); },
  'a1-xml': () => toast('Saved BPA1 2026.xml next to the recap. Nothing was sent to Coretax.', 'file'),
  'set-coll': (el) => { const k = el.dataset.k; ST[k] = !ST[k]; el.setAttribute('aria-expanded', String(ST[k])); el.parentNode.querySelector('.coll').classList.toggle('open', ST[k]); if (k === 'sys' && ST.sys) loadSys(); },
  'sys-again': () => loadSys(),
  upd: (el) => { el.disabled = true; $('#upd').textContent = 'Taxio Pilot v4.0.0 · checking…'; setTimeout(() => { ST.upd = 'you are on the latest version'; if (S.view === 'settings') { $('#upd').textContent = 'Taxio Pilot v4.0.0 · ' + ST.upd; el.disabled = false; } }, STATIC ? 10 : 800); },
  lim: (el) => { const k = el.dataset.k; const v = S.limits[k] + +el.dataset.v; S.limits[k] = Math.max(1, Math.min(k === 'pic' ? 5 : 12, v)); promote(); rerender(); toast('Saved: ' + S.limits.pic + ' windows per PIC, ' + S.limits.total + ' running at once', 'check'); },
  quit: () => dialog('<div class="dlg-h"><h2>Quit Taxio Pilot?</h2></div><div class="dlg-b"><div>' + (counts().running + counts().hold) + ' runs are running and ' + counts().queued + ' are queued. They stop, and all Coretax windows close.</div></div><div class="dlg-f"><button type="button" class="btn" data-a="close-dialog">Keep working</button><button type="button" class="btn btn-danger-solid" data-a="close-dialog">Quit app</button></div>'),
  toast: (el) => toast(el.dataset.msg, 'check'),
  // mockup toolbar
  'm-role': (el) => { S.role = el.dataset.v; seedAndGo(); }, 'm-data': (el) => { S.data = el.dataset.v; seedAndGo(); },
  'm-sim': () => { S.sim = !S.sim; renderMock(); }, 'm-step': () => tick(),
  'm-motion': () => { root.classList.toggle('rm'); renderMock(); }, 'm-reset': () => seedAndGo()
};
const byId = (el) => RUNS.find((r) => r.id === el.dataset.id);
function confirmStop(r) {
  dialog('<div class="dlg-h"><h2>Stop This Run?</h2></div><div class="dlg-b"><div><b class="t1">' + esc(cl(r.client).n) + '</b> · ' + esc(r.feat) + '</div><div class="t3">' + (r.kind === 'write' ? 'Steps already done in Coretax stay done. The step in progress is finished first, then the run stops.' : r.done + ' of ' + r.total + ' are downloaded; those files stay in the folder.') + ' Other runs keep going.</div></div><div class="dlg-f"><button type="button" class="btn" data-a="close-dialog">Keep running</button><button type="button" class="btn btn-danger-solid" id="stop-go">Stop run</button></div>', '', (d) => {
    $('#stop-go', d).addEventListener('click', () => { closeDialog(); requestStop(r); });
  });
}
function updBar(page) { const b = $('#abar'); if (b && DL[page]) b.innerHTML = dlBar(page); }
function loadSys() { const b = $('#sysbody'); if (!b) return; b.innerHTML = sysBody(true); setTimeout(() => { const x = $('#sysbody'); if (x) x.innerHTML = sysBody(false); }, STATIC ? 10 : 900); }
function seedAndGo() { seed(); renderMock(); if (S.role === 'restricted' && !visiblePage(S.view)) S.view = 'runs'; go(S.view); }

/* ---------- Mockup toolbar ---------- */
function renderMock() {
  const b = (a, v, label, on) => '<button type="button" data-a="' + a + '" data-v="' + v + '" aria-pressed="' + on + '">' + label + '</button>';
  $('#mock').innerHTML = '<b>Mockup</b>' + b('m-role', 'editor', 'Editor', S.role === 'editor') + b('m-role', 'restricted', 'Restricted Editor', S.role === 'restricted') + '<span class="sep"></span>'
    + b('m-data', 'busy', 'Busy day', S.data === 'busy') + b('m-data', 'first', 'First run', S.data === 'first') + '<span class="sep"></span>'
    + '<button type="button" data-a="m-sim" aria-pressed="' + S.sim + '">' + (S.sim ? '❚❚ Pause simulation' : '▶ Simulate runs') + '</button><button type="button" data-a="m-step">Step</button><button type="button" data-a="m-reset">Reset</button><span class="sep"></span>'
    + '<button type="button" data-a="m-motion" aria-pressed="' + root.classList.contains('rm') + '">Reduced motion</button>';
}
setInterval(() => { if (S.sim) tick(); }, 1400);

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]'); if (nav) return go(nav.dataset.nav);
  const po = e.target.closest('[data-pi]'); if (po) return palPick(+po.dataset.pi);
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && el.dataset.a !== 'slip') return;
  const fn = A[el.dataset.a]; if (fn) { e.stopPropagation(); fn(el, e); }
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.altKey) && k === 'k') { e.preventDefault(); if (dlgClose) closeDialog(true); return openPalette(FORM_PAGES.indexOf(S.view) >= 0 && SINGLE.indexOf(S.view) < 0 ? 'go' : 'go'); }
  if (e.ctrlKey && k === 'b') { e.preventDefault(); return toggleSidebar(); }
  if (e.key === 'Escape') { if (dlgClose) return closeDialog(); if (S.drawer) return closeDrawer(); if (S.sbOverlay) { S.sbOverlay = false; applySidebar(true); } }
  if (e.ctrlKey && e.key === 'Enter') { const p = $('.abar .btn-primary:not(:disabled)'); if (p && !dlgClose) p.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.rr[role=button]')) { e.preventDefault(); e.target.click(); }
});
let wasNarrow = window.innerWidth < 1100;
window.addEventListener('resize', () => { const n = window.innerWidth < 1100; if (n !== wasNarrow) { wasNarrow = n; S.sbOverlay = false; applySidebar(false); } placeThumbs(document); });

window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
/* ---------- Boot ---------- */
seed(); renderMock(); applySidebar(false); renderTop(); go('runs');
requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('preload')));
if (!STATIC && /[?&]sim=1/.test(location.search)) { S.sim = true; renderMock(); }
window.__mock = { S, U, X, tick, go, openDrawer, setTheme, toggleSidebar, openPalette, rerender };
})();
</script>
